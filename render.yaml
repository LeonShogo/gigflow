services:
  - type: web
    name: gigflow
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /manifest.webmanifest
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gigflow-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: gigflow-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: gigflow-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
      - key: UPLOAD_DIR
        value: /app/uploads/sheet-music
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75.0

databases:
  - name: gigflow-db
    databaseName: gigflow
    user: gigflow
    plan: free
    region: frankfurt
    ipAllowList: []
