<header class="shell">
  <a routerLink="/" class="shell__brand" [attr.aria-label]="'GigFlow – Startseite' | t">
    <img
      class="shell__mark"
      ngSrc="/svg/gigflow-icon.svg"
      width="34"
      height="34"
      priority
      alt=""
      aria-hidden="true"
    />
    <span class="shell__word">GigFlow</span>
  </a>

  <nav class="shell__nav" [attr.aria-label]="'Hauptnavigation' | t">
    <a
      routerLink="/"
      routerLinkActive="shell__nav-link--active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="shell__nav-link"
    >{{ 'Termine' | t }}</a>
    <a
      routerLink="/calendar"
      routerLinkActive="shell__nav-link--active"
      class="shell__nav-link"
    >{{ 'Kalender' | t }}</a>
    <a
      routerLink="/musicians"
      routerLinkActive="shell__nav-link--active"
      class="shell__nav-link"
    >{{ 'Musiker*innen' | t }}</a>
  </nav>

  <div class="shell__auth">
    <button
      type="button"
      class="shell__theme"
      [attr.aria-label]="(isDarkMode() ? 'Hellen Modus aktivieren' : 'Dunklen Modus aktivieren') | t"
      [attr.aria-pressed]="isDarkMode()"
      [title]="(isDarkMode() ? 'Hellen Modus aktivieren' : 'Dunklen Modus aktivieren') | t"
      (click)="toggleTheme()"
    >
      <span class="shell__theme-icon" aria-hidden="true">
        @if (isDarkMode()) {
          <svg viewBox="0 0 24 24" focusable="false">
            <circle cx="12" cy="12" r="3.25" />
            <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M20 15.7A8.5 8.5 0 0 1 8.3 4 8.5 8.5 0 1 0 20 15.7Z" />
          </svg>
        }
      </span>
      <span class="shell__theme-label">{{ (isDarkMode() ? 'Hell' : 'Dunkel') | t }}</span>
    </button>
    <div class="shell__language-menu">
      <button
        type="button"
        class="shell__language-trigger"
        [attr.aria-label]="'Sprache wählen' | t"
        aria-haspopup="listbox"
        [attr.aria-expanded]="languageMenuOpen()"
        (click)="toggleLanguageMenu()"
      ><span class="shell__language-flag" aria-hidden="true">{{ selectedLanguageFlag() }}</span></button>
      @if (languageMenuOpen()) {
        <div class="shell__language-list" role="listbox" [attr.aria-label]="'Sprache wählen' | t">
          @for (option of languages; track option.code) {
            <button
              type="button"
              class="shell__language-option"
              role="option"
              [class.shell__language-option--active]="language() === option.code"
              [attr.aria-selected]="language() === option.code"
              (click)="selectLanguage(option.code)"
            >
              <span class="shell__language-flag" aria-hidden="true">{{ option.flag }}</span>
              <span>{{ option.label }}</span>
            </button>
          }
        </div>
      }
    </div>
    @if (isAuthenticated()) {
      <span class="shell__user">
        {{ currentUser()?.email }}
      </span>
      <button type="button" class="shell__link" (click)="logout()">{{ 'Abmelden' | t }}</button>
    } @else {
      <a routerLink="/login" class="shell__link">{{ 'Anmelden' | t }}</a>
    }
  </div>
</header>

<router-outlet />

<app-toast />
