<header class="shell">
  <a routerLink="/" class="shell__brand" aria-label="GigFlow – Startseite">
    <img
      class="shell__mark"
      ngSrc="/svg/gigflow-icon.svg"
      width="34"
      height="34"
      priority
      alt=""
      aria-hidden="true"
    />
    <span class="shell__word">GigFlow</span>
  </a>

  <nav class="shell__nav" aria-label="Hauptnavigation">
    <a
      routerLink="/"
      routerLinkActive="shell__nav-link--active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="shell__nav-link"
    >Termine</a>
    <a
      routerLink="/calendar"
      routerLinkActive="shell__nav-link--active"
      class="shell__nav-link"
    >Kalender</a>
    <a
      routerLink="/musicians"
      routerLinkActive="shell__nav-link--active"
      class="shell__nav-link"
    >Musiker*innen</a>
  </nav>

  <div class="shell__auth">
    <button
      type="button"
      class="shell__theme"
      [attr.aria-label]="isDarkMode() ? 'Hellen Modus aktivieren' : 'Dunklen Modus aktivieren'"
      [attr.aria-pressed]="isDarkMode()"
      [title]="isDarkMode() ? 'Hellen Modus aktivieren' : 'Dunklen Modus aktivieren'"
      (click)="toggleTheme()"
    >
      <span class="shell__theme-icon" aria-hidden="true">
        @if (isDarkMode()) {
          <svg viewBox="0 0 24 24" focusable="false">
            <circle cx="12" cy="12" r="3.25" />
            <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M20 15.7A8.5 8.5 0 0 1 8.3 4 8.5 8.5 0 1 0 20 15.7Z" />
          </svg>
        }
      </span>
      <span class="shell__theme-label">{{ isDarkMode() ? 'Hell' : 'Dunkel' }}</span>
    </button>
    @if (isAuthenticated()) {
      <span class="shell__user">
        @if (isOrganizer()) {
          <span class="shell__badge">Organizer</span>
        }
        {{ currentUser()?.email }}
      </span>
      <button type="button" class="shell__link" (click)="logout()">Abmelden</button>
    } @else {
      <a routerLink="/login" class="shell__link">Anmelden</a>
    }
  </div>
</header>

<router-outlet />
