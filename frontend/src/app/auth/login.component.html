<section class="auth">
  <div class="auth__card">
    <a class="auth__back" routerLink="/">← Zurück zur Übersicht</a>
    <h1 class="auth__title">
      {{ mode() === 'login' ? 'Anmelden' : 'Registrieren' }}
    </h1>

    @if (error(); as message) {
      <p class="auth__error" role="alert">{{ message }}</p>
    }

    <form class="auth__form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="auth__field">
        <span>E-Mail</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          [attr.aria-invalid]="
            form.controls.email.invalid && form.controls.email.touched ? 'true' : 'false'
          "
        />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <span class="auth__hint">Bitte eine gültige E-Mail-Adresse angeben.</span>
        }
      </label>

      <label class="auth__field">
        <span>Passwort</span>
        <input type="password" formControlName="password" autocomplete="current-password" />
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <span class="auth__hint">Das Passwort muss mindestens 8 Zeichen haben.</span>
        }
      </label>

      @if (mode() === 'register') {
        <label class="auth__field">
          <span>Vorname</span>
          <input type="text" formControlName="firstName" autocomplete="given-name" />
        </label>
        <label class="auth__field">
          <span>Nachname</span>
          <input type="text" formControlName="lastName" autocomplete="family-name" />
        </label>
        <label class="auth__field">
          <span>Instrument (optional)</span>
          <input type="text" formControlName="instrument" />
        </label>
      }

      <button type="submit" class="auth__submit" [disabled]="submitting()">
        {{ submitting() ? 'Bitte warten …' : mode() === 'login' ? 'Anmelden' : 'Konto erstellen' }}
      </button>
    </form>

    <p class="auth__switch">
      <button type="button" class="auth__switch-btn" (click)="toggleMode()">
        {{ mode() === 'login' ? 'Noch kein Konto? Registrieren' : 'Schon ein Konto? Anmelden' }}
      </button>
    </p>
  </div>
</section>
