name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven / Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gigflow
          POSTGRES_PASSWORD: gigflow-ci
          POSTGRES_DB: gigflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gigflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_PASSWORD: gigflow-ci
      JWT_SECRET: ci-only-dummy-secret-with-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests ausführen
        run: ./mvnw -B --no-transfer-progress test

  frontend:
    name: Frontend (Angular / Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Tests ausführen
        run: npm test -- --watch=false
      - name: Production-Build
        run: npm run build
      - name: Code-Format prüfen (Warnstufe)
        run: npx prettier --check "src/**/*.{ts,html,scss}"
        continue-on-error: true
