spring.application.name=backend
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5432/gigflow
spring.datasource.username=gigflow
spring.datasource.password=${DB_PASSWORD}
app.jwt-secret=${JWT_SECRET:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

app.sheet-pdf-dir=${UPLOAD_DIR:./uploads/sheet-music}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:no-reply@gigflow.local}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:4200}
