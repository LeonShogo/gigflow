spring.application.name=backend
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5432/gigflow
spring.datasource.username=gigflow
spring.datasource.password=${DB_PASSWORD}
app.jwt-secret=${JWT_SECRET:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

app.sheet-pdf-dir=${UPLOAD_DIR:./uploads/sheet-music}
app.public-base-url=${APP_PUBLIC_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:4200}}
